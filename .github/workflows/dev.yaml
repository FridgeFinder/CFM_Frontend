name: Continuous Integration

on:
  push:
    branches:
      - dev
  pull_request:
    branches: [dev]

jobs:
  Install_Dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '22.20.0'
          cache: 'yarn'

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache Yarn dependencies
        uses: actions/cache@v3
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install
        continue-on-error: true

  Run_Build:
    needs:
      - Install_Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Cache Yarn Dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Run Build
        run: |
          yarn build

  Run_Test:
    needs:
      - Install_Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Cache Yarn Dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Run Tests
        run: |
          yarn test || true

  Run_Lint:
    needs:
      - Install_Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Cache Yarn Dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Run Lint
        run: |
          yarn lint || true

  Warm_CDN:
    # Runs only on direct pushes (not PRs) so we warm after real deploys only.
    # Amplify deploys in parallel with CI and typically finishes in 2-3 minutes.
    # We wait 3 minutes to give Amplify time to complete CDN propagation before
    # warming the edges.
    # To enable: add WARM_BASE_URL as a GitHub Actions secret pointing to the
    # Amplify branch URL (e.g. https://u2-jp.d1zqbru9k8x5eq.amplifyapp.com).
    if: github.event_name == 'push'
    needs:
      - Run_Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '22.20.0'

      - name: Wait for Amplify deployment
        run: sleep 300

      - name: Warm CDN edge caches
        if: env.WARM_BASE_URL != ''
        env:
          WARM_BASE_URL: ${{ secrets.WARM_BASE_URL }}
        run: node scripts/warm-cdn.mjs
        continue-on-error: true
